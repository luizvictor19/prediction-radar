name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        id: install
        run: |
          npm ci
          npm ci --prefix web

      # The gate, in the order of `npm run check`. Every step after install runs
      # even when an earlier one failed, so one red step does not hide the
      # result of the others.
      - name: format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: typecheck (web)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:web

      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      # The screen's build, with canary values in every server secret. The
      # build needs none of them (the routes read them at request time); they
      # are here only so the next step can prove none reaches the browser.
      - name: build (web)
        id: build-web
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:web
        env:
          SUPABASE_URL: https://canario.supabase.co
          SUPABASE_SERVICE_KEY: canario-chave-de-servico-ci
          RADAR_SENHA: canario-senha-da-tela-no-ci-com-mais-de-24
          RADAR_SEGREDO_DE_SESSAO: canario-segredo-de-sessao-ci

      # Scans web/.next/static, everything a browser can download, byte by
      # byte for the canaries above.
      - name: conferir:bundle
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' }}
        run: npm run conferir:bundle
        env:
          SUPABASE_SERVICE_KEY: canario-chave-de-servico-ci
          RADAR_SENHA: canario-senha-da-tela-no-ci-com-mais-de-24
          RADAR_SEGREDO_DE_SESSAO: canario-segredo-de-sessao-ci

      # test:db needs a real Postgres. src/lib/test-db.ts refuses any URL whose
      # host is not this machine, so the stack is a local Supabase started inside
      # the runner, with every migration applied to it, and never the project's.
      # No repository secret is involved: the URL and service key are the CLI's
      # public demo defaults. RADAR_TEST_DB=required (set by the script) turns an
      # absent stack into a failure instead of a skip.
      - uses: supabase/setup-cli@v1
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          version: 2.122.0

      - name: test:db
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:db
